<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Asia Cosmetics product display</title>
  <desc id="desc">Stylized fallback artwork for the cosmetics media panel.</desc>
  <defs>
